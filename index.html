    <script>
      // Fix for environments where window.fetch has only a getter without a setter
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
